name: Run All Tests

on:
  push:
    branches: [main, dev]  # Runs on every push to these branches
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'  # Match your .python-version
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run all test files
      run: |
        set -e  # Exit on first failure
        python test_crypto_performance.py
        python test_dht.py
        python test_multi_profile.py
        python test_security_fixes.py
        python test_sms_gateway.py
        python test_tui.py
        python test_update.py
        python test_web_multi_profile.py
        python test_ws_push.py
        python _tui_pty_harness.py

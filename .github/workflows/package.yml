name: Package (pip / pipx)

# Builds the wheel + sdist, installs it with pipx on all three OSes and smoke-tests
# the `pe-em` / `enclave-messenger` commands. Publishing to PyPI happens only when a
# GitHub Release is published, through PyPI "Trusted Publishing" (no API token is stored).
#
# One-time setup on PyPI (https://pypi.org/manage/account/publishing/):
#   add a pending publisher: project "project-enclave-messenger", owner "Project-Enclave",
#   repository "Enclave-Messenger", workflow "package.yml", environment "pypi".
# The executables are built separately by build-release.yml (tag push).

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: The wheel must contain the templates and plugin manifests, and no tests or dev shims
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          need = ["enclave_messenger/templates/chat.html",
                  "enclave_messenger/core/plugins/builtin/sms_gateway/manifest.json",
                  "enclave_messenger/core/plugins/builtin/bluetooth/manifest.json"]
          missing = [n for n in need if n not in names]
          bad = [n for n in names if n.split("/")[0] in ("test", "tests", "web.py", "set.py", "reset.py", "update.py")
                 or n.startswith("test_")]
          assert not missing, f"missing from wheel: {missing}"
          assert not bad, f"unexpected files in wheel: {bad}"
          print("wheel contents OK:", len(names), "files")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist
          path: dist/

  tests:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Packaging tests (paths, migration, CLI, spawn)
        run: python test/run_all.py test_packaging test_at_rest

  smoke-pipx:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: dist
      - name: Install with pipx
        shell: bash
        run: |
          python -m pip install pipx
          python -m pipx install dist/*.whl
          python -m pipx ensurepath
      - name: Smoke-test both commands
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python scripts/smoke_install.py pe-em pipx
          python scripts/smoke_install.py enclave-messenger pipx

  publish:
    needs: [build, tests, smoke-pipx]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/project-enclave-messenger
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: dist
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33

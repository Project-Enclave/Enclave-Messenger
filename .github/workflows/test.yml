name: Run All Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio
    
    # Runs every test_*.py in test/ (pytest-style files with pytest, script-style
    # files as scripts) one after another and fails if any of them fails. A new
    # test file is picked up automatically; nothing to register here.
    - name: Run every test in test/
      run: python test/run_all.py

    - name: Coverage (pytest-style tests)
      run: |
        pytest test \
          --cov=src/enclave_messenger \
          --cov-report=xml \
          --cov-report=term-missing
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
